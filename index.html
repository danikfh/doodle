<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0a0d1c">
<title>Прыжок пришельца: мультиплеер</title>
<style>
:root{--bg:#dde5f4;--frame:#1c2347;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#070a16;--frame:#2a3566}}
:root[data-theme="dark"]{--bg:#070a16;--frame:#2a3566}
[hidden]{display:none!important}
html{height:100%}
@supports (height:100dvh){html{height:100dvh}}
body{margin:0;height:100%;display:grid;place-items:center;overflow:hidden;background:var(--bg);touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none;font-family:ui-rounded,"Nunito","Trebuchet MS",system-ui,sans-serif}
#wrap{position:relative;overflow:hidden;background:#0b1030}
#wrap.framed{border-radius:22px;box-shadow:0 0 0 6px var(--frame),0 24px 60px rgba(0,0,0,.4)}
canvas{display:block;width:100%;height:100%;touch-action:none}
#ov{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(6,9,24,.72);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);color:#fff;text-align:center}
#ov.hide{display:none}
.card{width:82%}
h1{margin:0 0 .5em;font-size:1.8em;line-height:1.1}
#rc{color:#7be495;letter-spacing:.08em}
input{box-sizing:border-box;width:100%;font:inherit;font-size:max(16px,1.1em);padding:.6em .8em;border:2px solid #3a4590;border-radius:.8em;background:#141a45;color:#fff;text-align:center;user-select:text;-webkit-user-select:text;text-transform:none}
#code{text-transform:uppercase}
button{display:block;width:100%;margin:.55em 0;font:inherit;font-size:max(16px,1.15em);font-weight:800;padding:.65em 1em;border:0;border-radius:999px;color:#0b2a1a;cursor:pointer;background:linear-gradient(#8ff0a4,#3fbf7f);box-shadow:0 .18em 0 #1f7a4d;touch-action:manipulation}
button.alt{color:#fff;background:linear-gradient(#4a58c4,#323d96);box-shadow:0 .18em 0 #1c2467}
button:disabled{opacity:.45}
button:active{transform:translateY(.1em)}
.row{display:flex;gap:.5em;align-items:center}.row button{width:auto;flex:none;margin:0;padding:.6em 1.1em}
.hint{margin:.7em 0 0;font-size:.85em;line-height:1.4;opacity:.8;min-height:1.2em}
ul,ol{list-style:none;margin:0 0 .6em;padding:0;text-align:left}
li{display:flex;justify-content:space-between;align-items:center;padding:.45em .8em;margin:.3em 0;border-radius:.7em;background:#141a45;border-left:.5em solid var(--c,#7be495)}
li.me{outline:2px solid #fff}li b{font-weight:700}
#snd{position:absolute;top:.6em;right:.6em;z-index:10;width:2.3em;height:2.3em;margin:0;padding:0;border-radius:50%;font-size:max(16px,1.1em);line-height:1;display:flex;align-items:center;justify-content:center;background:rgba(20,26,69,.78);box-shadow:none;color:#fff}
.tabs{display:flex;gap:.3em;margin-bottom:.6em}.tabs button{flex:1;margin:0;padding:.5em .1em;font-size:max(12px,.75em);box-shadow:none}
.tabs button.on{background:linear-gradient(#8ff0a4,#3fbf7f);color:#0b2a1a}
li button{display:inline-block;width:auto;margin:0 0 0 .4em;padding:.4em .8em;font-size:max(13px,.8em);box-shadow:none}
.bal{font-weight:800;color:#ffd34d;margin-bottom:.5em}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="cv"></canvas>
  <div id="ov"><div class="card">
    <section id="s-menu">
      <h1>Прыжок пришельца</h1>
      <input id="nick" maxlength="12" placeholder="Ваш ник" autocomplete="off">
      <button id="bCreate">Создать комнату</button>
      <div class="row"><input id="code" maxlength="5" placeholder="Код комнаты" autocomplete="off"><button class="alt" id="bJoin">Войти</button></div>
      <button class="alt" id="bSolo">Играть одному</button>
      <button class="alt" id="bShop">Магазин</button>
      <p class="hint" id="mbal"></p>
      <p class="hint" id="st">Касайтесь левой или правой половины экрана. На компьютере: ← → или A / D.</p>
    </section>
    <section id="s-lobby" hidden>
      <h1>Комната <span id="rc"></span></h1>
      <ul id="pl"></ul>
      <button class="alt" id="bShare">Скопировать ссылку</button>
      <button id="bStart">Начать игру</button>
      <button class="alt" id="bLeave">Отмена</button>
      <p class="hint" id="lh"></p>
    </section>
    <section id="s-shop" hidden>
      <h1>Магазин</h1>
      <div class="bal" id="bal"></div>
      <div class="tabs"><button class="alt tab" data-t="skin">Скины</button><button class="alt tab" data-t="plat">Платформы</button><button class="alt tab" data-t="bg">Фоны</button><button class="alt tab" data-t="mus">Музыка</button></div>
      <ul id="shl"></ul>
      <p class="hint" id="shm"></p>
      <button class="alt" id="bShopBack">Назад</button>
    </section>
    <section id="s-end" hidden>
      <h1 id="et"></h1>
      <ol id="rk"></ol>
      <button id="bAgain">Играть снова</button>
      <button class="alt" id="bMenu">В меню</button>
      <p class="hint" id="eh"></p>
    </section>
  </div></div>
  <button id="snd" type="button" aria-label="Звук">🔊</button>
</div>
<script>
(()=>{
  // === ВСТАВЬТЕ СВОИ ДАННЫЕ ИЗ КОНСОЛИ FIREBASE НИЖЕ ===
const firebaseConfig = {
    apiKey: "AIzaSyACxUzNcf4h6JPrXyDja18iBYsf0S6UI3M",
    authDomain: "doodle-e7a1a.firebaseapp.com",
    databaseURL: "https://doodle-e7a1a-default-rtdb.europe-west1.firebasedatabase.app",
    projectId: "doodle-e7a1a",
    storageBucket: "doodle-e7a1a.firebasestorage.app",
    messagingSenderId: "20752973329",
    appId: "1:20752973329:web:3b17218edd052d4305fbb0",
    measurementId: "G-Q64BCQYCDD"
  };

  let db=null,FB=null,fbPromise=null;
  const tmo=(p,ms,msg)=>{let id;return Promise.race([p,new Promise((_,rej)=>{id=setTimeout(()=>rej(new Error(msg)),ms)})]).finally(()=>clearTimeout(id))};
  const fbErr=e=>{const m=String(e&&(e.code||e.message)||e);
    return /permission|PERMISSION/.test(m)?'Firebase запретил доступ: в консоли откройте Realtime Database → Правила и разрешите чтение/запись для rooms':'Ошибка: '+m};
  function loadFB(){
    if(fbPromise)return fbPromise;
    const base='https://www.gstatic.com/firebasejs/10.8.0/';
    fbPromise=tmo(Promise.all([import(base+'firebase-app.js'),import(base+'firebase-database.js')]),12000,'Не удалось загрузить Firebase (проверьте интернет и блокировщики рекламы)')
      .then(([a,d])=>{
        FB={ref:d.ref,set:d.set,get:d.get,onValue:d.onValue,onDisconnect:d.onDisconnect,update:d.update,remove:d.remove};
        db=d.getDatabase(a.initializeApp(firebaseConfig));return FB;
      }).catch(e=>{fbPromise=null;throw e});
    return fbPromise;
  }

  const W=400,H=700,MAX_SCORE_DIFF=1000,COLORS=['#7be495','#ff7eb6','#ffd166','#b79cff'],SEND_MS=30;
  const $=id=>document.getElementById(id),cv=$('cv'),ctx0=cv.getContext('2d'),wrap=$('wrap'),ov=$('ov');
  let ctx=ctx0;
  function fit(){
    const bw=document.body.clientWidth,bh=document.body.clientHeight,pad=bw>=560?24:0,S=Math.min((bw-pad*2)/W,(bh-pad*2)/H);
    wrap.classList.toggle('framed',pad>0);
    wrap.style.width=W*S+'px';wrap.style.height=H*S+'px';wrap.style.fontSize=S*16+'px';
    const d=Math.min(devicePixelRatio||1,3);cv.width=Math.round(W*S*d);cv.height=Math.round(H*S*d);
    ctx.setTransform(cv.width/W,0,0,cv.height/H,0,0);
  }
  addEventListener('resize',fit);if(window.visualViewport)visualViewport.addEventListener('resize',fit);fit();
  document.addEventListener('touchmove',e=>{if(e.target.tagName!=='INPUT')e.preventDefault()},{passive:false});
  ['gesturestart','gesturechange','contextmenu'].forEach(n=>document.addEventListener(n,e=>e.preventDefault()));

  // ---------- seeded RNG ----------
  let rng=Math.random;
  function mulberry(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
  const rnd=(a,b)=>a+rng()*(b-a);

  // ---------- state ----------
  let best=0,nick='';try{best=+localStorage.getItem('alienJumpBest')||0;nick=localStorage.getItem('alienJumpNick')||''}catch(e){}
  $('nick').value=nick;
  const stars=Array.from({length:80},()=>({x:Math.random()*W,y:Math.random()*H,r:.6+Math.random()*1.2,z:.08+Math.random()*.22,p:Math.random()*6.28}));
  let P,plats=[],coins=[],runCoins=0,camY=0,topY=0,score=0,squash=0,t=0,dead=false,deathMsg='',started=false,sendT=0;
  let gameTotal=1,isHost=false,me=0,code='',players=[],unsubRoom=null,currentSeed=0,isSolo=false;
  const mk=(i,n)=>({i,n,score:0,dead:false,x:200,y:625,tx:200,ty:625,deathTime:0});
  const list=()=>players.filter(Boolean);

  function reset(seed){
    rng=mulberry(seed);camY=0;score=0;squash=0;
    P={x:200,y:625,vx:0,vy:0,w:34,h:50,face:1,jet:0,shield:0};coins=[];
    plats=[{x:165,y:650,w:70,h:14,type:0,dx:0}];topY=650;fill();
  }
  function fill(){
    while(topY>camY-120){
      const d=Math.min((650-topY)/2500,1),gap=rnd(55,85+d*60);
      topY-=gap;
      const type=rng()<.1+d*.25?1:0;
      const np={x:rnd(0,W-70),y:topY,w:70,h:14,type,dx:type?(rng()<.5?-1:1)*rnd(1,1.6+d):0};plats.push(np);
      const rb=rng(),rc=rng(),rk=rng();
      if(type===0&&rb<.1)np.b={k:rk<.6?0:rk<.85?1:2,ox:rnd(14,56),t:0};
      else if(type===0&&rc<.3)coins.push({x:np.x+35,y:topY-28,got:0});
      if(rng()<.14)coins.push({x:rnd(30,W-30),y:topY+gap*rnd(.3,.7),got:0});
      if(rng()<.18+d*.3)plats.push({x:rnd(0,W-70),y:topY+gap*rnd(.3,.7),w:70,h:14,type:2,broken:0,vy:0,rot:0});
    }
  }
  reset(1);

  // ---------- save / shop data ----------
  const IT={skin:[['Пришелец',0],['Киборг',150],['Король',300],['Неон',500],['Вика',1]],plat:[['Классика',0],['Неон',120],['Лёд',250],['Золото',400],['Поезда',2]],bg:[['Ночной космос',0],['Закат',150],['Матрица',250],['Туманность',400]],mus:[['Космо-арпеджио',0, null],['Синтвейв',120, null],['Чиптюн',250, null],['Амбиент',350,null],['Династия',50,'track1.mp3']]};
  let save={coins:0,own:{skin:[1,0,0,0,0],plat:[1,0,0,0,0],bg:[1,0,0,0],mus:[1,0,0,0,0]},eq:{skin:0,plat:0,bg:0,mus:0},snd:1};
  try{const o=JSON.parse(localStorage.getItem('alienJumpSave')||'null');if(o){save={...save,...o,own:{...save.own,...o.own},eq:{...save.eq,...o.eq}};}}catch(e){}
  // миграция старых сохранений: дополняем массивы владения новыми предметами
  ['skin','plat','bg','mus'].forEach(k=>{if(!Array.isArray(save.own[k]))save.own[k]=[1];while(save.own[k].length<IT[k].length)save.own[k].push(0);if(!(save.eq[k]>=0&&save.eq[k]<IT[k].length&&save.own[k][save.eq[k]]))save.eq[k]=0});
  const persist=()=>{try{localStorage.setItem('alienJumpSave',JSON.stringify(save))}catch(e){}};
  let tab='skin',prevM=-1;

  // ---------- Web Audio ----------
// ---------- Web Audio ----------
  let AC=null,master,musG,sfxG,mT=null,mCur=-1,mStep=0,mNext=0;
  let bgmEl=null,bgmSrc='';

  function audio(){
    if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)();master=AC.createGain();master.gain.value=save.snd?1:0;master.connect(AC.destination);
      musG=AC.createGain();musG.gain.value=.2;musG.connect(master);sfxG=AC.createGain();sfxG.gain.value=.45;sfxG.connect(master)}catch(e){return null}}
    if(AC.state==='suspended')AC.resume();return AC;
  }
  function tone(f,d,ty,v,t0,to,dest){
    const o=AC.createOscillator(),g=AC.createGain();o.type=ty;o.frequency.setValueAtTime(f,t0);if(to)o.frequency.exponentialRampToValueAtTime(to,t0+d);
    g.gain.setValueAtTime(v,t0);g.gain.exponentialRampToValueAtTime(.001,t0+d);o.connect(g);g.connect(dest||sfxG);o.start(t0);o.stop(t0+d+.05);
  }
  function noiseAt(t0,d,v,dest){
    const n=Math.max(1,AC.sampleRate*d|0),buf=AC.createBuffer(1,n,AC.sampleRate),a=buf.getChannelData(0);
    for(let i=0;i<n;i++)a[i]=(Math.random()*2-1)*(1-i/n);
    const s=AC.createBufferSource(),g=AC.createGain();s.buffer=buf;g.gain.value=v;s.connect(g);g.connect(dest||sfxG);s.start(t0);
  }
  const m2f=m=>440*Math.pow(2,(m-69)/12),nt=(m,d,ty,v,t)=>tone(m2f(m),d,ty,v,t,0,musG);
  function sfx(n){
    if(!save.snd||!audio())return;const now=AC.currentTime,T=(f,d,ty,v,w,to)=>tone(f,d,ty,v,now+(w||0),to);
    if(n==='jump')T(300,.14,'square',.12,0,640);
    else if(n==='coin'){T(988,.07,'square',.13);T(1319,.14,'square',.13,.06)}
    else if(n==='spring')T(160,.35,'sine',.5,0,1100);
    else if(n==='brk')noiseAt(now,.3,.35);
    else if(n==='up'){T(523,.08,'triangle',.3);T(659,.08,'triangle',.3,.07);T(784,.16,'triangle',.3,.14)}
    else if(n==='dead')T(400,.6,'sawtooth',.22,0,50);
  }
  const TR=[
    {bpm:112,f:(s,t)=>{const C=[[57,60,64],[53,57,60],[48,52,55],[55,59,62]][(s>>4)&3],i=s&15;if(!(i&1))nt(C[(i>>1)%3]+((i>>1)%4===3?12:0),.3,'triangle',.2,t);if(i===0||i===8)nt(C[0]-24,.9,'sine',.4,t)}},
    {bpm:100,f:(s,t)=>{const r=[45,41,48,43][(s>>4)&3],i=s&15,L=[0,-1,7,-1,10,-1,7,-1,12,-1,10,-1,7,-1,3,-1][i];if(!(i&1))nt(r-12,.2,'sawtooth',.14,t);if(!(i&3))nt(36,.14,'sine',.5,t);if(L>=0)nt(r+12+L,.3,'square',.06,t);if(i===4||i===12)noiseAt(t,.1,.08,musG)}},
    {bpm:150,f:(s,t)=>{const bar=(s>>4)&3,i=s&15,sc=[60,62,64,67,69,72];if(!(i&1))nt(sc[(i*3+bar*2)%6],.13,'square',.08,t);if(!(i&3))nt([48,43,45,41][bar],.2,'triangle',.3,t);if(i&1)noiseAt(t,.03,.04,musG)}},
    {bpm:64,f:(s,t)=>{const C=[[57,60,64],[53,57,60],[55,59,62],[52,55,59]][(s>>5)&3];if((s&31)===0)C.forEach(n=>nt(n-12,3.8,'sine',.12,t));if(s%5===0)nt(C[(s/5|0)%3]+24,1.2,'sine',.05,t)}}
  ];
  function sched(){const tr=TR[mCur];while(mNext<AC.currentTime+.3){tr.f(mStep,mNext);mNext+=15/tr.bpm;mStep++}}
  function stopAllMusic(){
    clearInterval(mT);mT=null;
    if(bgmEl)bgmEl.pause();
  }
  function syncMusic(force){
    const want=prevM>=0?prevM:save.eq.mus;
    if(!save.snd){stopAllMusic();return}
    const trackInfo=IT.mus[want]||IT.mus[0];
    const fileUrl=trackInfo[2];
    if(fileUrl){
      clearInterval(mT);mT=null;
      if(!bgmEl){bgmEl=new Audio();bgmEl.loop=true;bgmEl.volume=.35}
      if(force||bgmSrc!==fileUrl||bgmEl.paused){
        if(bgmSrc!==fileUrl){bgmEl.src=fileUrl;bgmSrc=fileUrl}
        bgmEl.play().catch(()=>{});
      }
      return;
    }
    if(bgmEl){bgmEl.pause();bgmSrc=''}
    if(!audio())return;
    if(force||!mT||mCur!==want){clearInterval(mT);mCur=want;mStep=0;mNext=AC.currentTime+.08;mT=setInterval(sched,80)}
  }
  function setSnd(init){
    $('snd').textContent=save.snd?'🔊':'🔇';
    if(master)master.gain.value=save.snd?1:0;
    if(bgmEl)bgmEl.muted=!save.snd;
    if(!init)syncMusic(true);
  }

  // ---------- shop ----------
  function withCtx(c,fn){const o=ctx;ctx=c;try{fn()}finally{ctx=o}}
  function thumb(kind,i){
    const c=document.createElement('canvas');c.width=c.height=56;c.style.cssText='width:3em;height:3em;border-radius:.5em;flex:none;margin-right:.6em;background:#0b1030';
    const g=c.getContext('2d');
    withCtx(g,()=>{
      if(kind==='skin'){g.translate(28,54);g.scale(.62,.62);alien(0,0,1,1,1,COLORS[0],1,'',i,0)}
      else if(kind==='plat'){[[0,14],[1,34]].forEach(([ty,y])=>{g.save();g.translate(7,y);g.scale(.6,.6);pbody(ty,70,14,i);g.restore()})}
      else{g.scale(56/W,56/H);bg(i)}
    });
    return c;
  }
  const mkb=(txt,fn,dis)=>{const b=document.createElement('button');b.textContent=txt;b.disabled=!!dis;b.onclick=fn;return b};
  function shop(msg){
    scr('shop');$('bal').textContent='Монеты: '+save.coins;$('shm').textContent=msg||'';
    document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('on',b.dataset.t===tab));
    const ul=$('shl');ul.textContent='';
    IT[tab].forEach(([name,price],i)=>{
      const li=document.createElement('li'),own=save.own[tab][i],eq=save.eq[tab]===i;
      li.style.setProperty('--c',eq?'#7be495':'#3a4590');
      if(tab!=='mus')li.append(thumb(tab,i));
      const b=document.createElement('b');b.textContent=name;b.style.flex='1';li.append(b);
      if(tab==='mus')li.append(mkb(prevM===i?'■':'▶',()=>{audio();prevM=prevM===i?-1:i;syncMusic(true);shop()}));
      li.append(mkb(eq?'Выбрано':own?'Выбрать':'Купить '+price,()=>{
        if(!own){if(save.coins<price)return shop('Не хватает монет');save.coins-=price;save.own[tab][i]=1}
        save.eq[tab]=i;persist();shop();if(tab==='mus')syncMusic(true);
      },eq));
      ul.append(li);
    });
  }

  // ---------- screens ----------
  function scr(n){['menu','lobby','end','shop'].forEach(k=>$('s-'+k).hidden=k!==n);ov.classList.remove('hide');if(n==='menu')$('mbal').textContent='Монеты: '+save.coins}
  const st=m=>{$('st').textContent=m};
  function cleanup(){
    if(unsubRoom){unsubRoom();unsubRoom=null;}
    isHost=false;isSolo=false;
  }
  function fail(m){
    started=false;cleanup();
    scr('menu');st(m);
  }
  function lobby(){
    scr('lobby');$('rc').textContent=code;
    const ul=$('pl');ul.textContent='';
    list().forEach(p=>{const li=document.createElement('li');li.style.setProperty('--c',COLORS[p.i]);li.className=p.i===me?'me':'';const b=document.createElement('b');b.textContent=p.n;li.append(b);ul.append(li)});
    $('bStart').hidden=!isHost;$('bStart').disabled=list().length<2;
    $('lh').textContent=isHost?(list().length<2?'Ждём игроков (от 2 до 4). Отправьте им ссылку.':'Все готовы? Жмите «Начать игру».'):'Ждём, пока хост начнёт игру.';
  }
  function showEnd(rank){
    started=false;scr('end');
    const solo=rank.length<2;
    $('et').textContent=solo?'Игра окончена':(rank[0].i===me?'Победа!':'Победил '+rank[0].n);
    const ol=$('rk');ol.textContent='';
    rank.forEach((r,k)=>{const li=document.createElement('li');li.style.setProperty('--c',COLORS[r.i]);li.className=r.i===me?'me':'';
      const a=document.createElement('b'),s=document.createElement('span');a.textContent=(k+1)+'. '+r.n;s.textContent=r.s;li.append(a,s);ol.append(li)});
    $('bAgain').hidden=!isHost;$('eh').textContent=isHost?((solo?'Рекорд: '+best:'')+(runCoins?(solo?' · ':'')+'Монет: '+runCoins:'')):'Ждём решения хоста.';
  }

  // ---------- Firebase network ----------
  async function ensureFB(){
    st('Подключаем сервер…');
    try{await loadFB();return true}catch(e){st(fbErr(e));return false}
  }

  function subscribeRoom(roomCode) {
    const { ref, onValue, update } = FB;
    const roomRef = ref(db, 'rooms/' + roomCode);
    unsubRoom = onValue(roomRef, (snap) => {
      const data = snap.val();
      if (!data) {
        if (!isHost) fail('Комната закрыта хостом');
        return;
      }

      const rawPlayers = data.players || {};
      const nextPlayers = [];
      for (let i = 0; i < 4; i++) {
        const rp = rawPlayers[i];
        if (rp) {
          if (!players[i]) {
            nextPlayers[i] = mk(i, rp.n);
          } else {
            nextPlayers[i] = players[i];
            nextPlayers[i].n = rp.n;
          }
          if (i !== me) {
            nextPlayers[i].tx = rp.x ?? 200;
            nextPlayers[i].ty = rp.y ?? 625;
            nextPlayers[i].score = rp.s ?? 0;
            nextPlayers[i].dead = !!rp.d;
            nextPlayers[i].deathTime = rp.dt ?? 0;
            nextPlayers[i].k = rp.k | 0;
            nextPlayers[i].b = rp.b | 0;
          }
        }
      }
      players = nextPlayers;

      if (data.status === 'lobby') {
        if (started) started = false;
        lobby();
      } else if (data.status === 'playing') {
        if (!started && data.seed !== currentSeed) {
          currentSeed = data.seed;
          begin(data.seed);
        }
        // Хост проверяет, остался ли 1 выживший
        if (isHost && started) {
          const L = list();
          const alive = L.filter(p => !p.dead);
          if (alive.length <= (gameTotal > 1 ? 1 : 0)) {
            const rank = [...L].sort((a, b) => {
              if (a.dead !== b.dead) return a.dead - b.dead;
              if (a.dead && b.dead && a.deathTime !== b.deathTime) return b.deathTime - a.deathTime;
              return b.score - a.score;
            }).map(p => ({ i: p.i, n: p.n, s: p.score }));
            update(roomRef, { status: 'ended', rank });
          }
        }
      } else if (data.status === 'ended') {
        if (data.rank) {
          currentSeed = 0;
          showEnd(data.rank);
        }
      }
    }, (err) => {
      fail(fbErr(err));
    });
  }

  async function createRoom() {

    st('Создаём комнату…');

    try {
      let roomCode = '';

        const candidate = genCode();
        const snap = await tmo(get(ref(db, 'rooms/' + candidate)),9000,'Сервер не отвечает: проверьте databaseURL и интернет');
        if (!snap.exists()) {
          roomCode = candidate;
          break;
        }
      }
      if (!roomCode) return fail('Не удалось сгенерировать код комнаты');
      code = roomCode;

      const roomRef = ref(db, 'rooms/' + code);
      const initialData = {
        status: 'lobby',
        seed: 0,
        players: {
          0: { n: nick, x: 200, y: 625, s: 0, d: 0, dt: 0, k: save.eq.skin, b: 0 }
        }
      };
      await tmo(set(roomRef, initialData),9000,'Сервер не отвечает: проверьте databaseURL и интернет');
      onDisconnect(roomRef).remove();
      players = [mk(0, nick)];
      subscribeRoom(code);

      fail(fbErr(e));
    }
  }

    if (!(await ensureFB())) return;
    code = $('code').value.trim().toUpperCase();

    readNick();
    cleanup();
    isHost = false;
    st('Подключаемся…');
    const { ref, get, set, onDisconnect } = FB;

    try {
      const roomRef = ref(db, 'rooms/' + code);
      const snap = await tmo(get(roomRef),9000,'Сервер не отвечает: проверьте databaseURL и интернет');
      if (!snap.exists()) return fail('Комната не найдена');

      const data = snap.val();
      if (data.status !== 'lobby') return fail('Игра уже идёт');

      const existing = data.players || {};
      const freeSlot = [1, 2, 3].find(i => !existing[i]);
      if (freeSlot === undefined) return fail('Комната заполнена');

      me = freeSlot;
      const myRef = ref(db, `rooms/${code}/players/${me}`);
      await tmo(set(myRef, { n: nick, x: 200, y: 625, s: 0, d: 0, dt: 0, k: save.eq.skin, b: 0 }),9000,'Сервер не отвечает');
      onDisconnect(myRef).remove();

      subscribeRoom(code);
    } catch (e) {
      fail(fbErr(e));
    }
  }

  function train(type,w,h,dir,br){

    const fn=type===2?oldCar:wagon;
    if(type===2&&br>=0){ // вагон разламывается пополам по трещине
      const d=Math.min(9,br*16),a=Math.min(.7,br*.9);
      [[0,-1],[1,1]].forEach(([s,m])=>{ctx.save();ctx.translate(31,7);ctx.translate(m*d,d*.5);ctx.rotate(m*a*.5);ctx.translate(-31,-7);
        ctx.beginPath();ctx.rect(s?31:-12,-14,s?w-31+14:43,45);ctx.clip();fn(w,h);ctx.restore()});
      return;
    }
    fn(w,h);
  }
  function pbody(type,w,h,sk,dir,br){
    if(sk===4){train(type,w,h,dir,br);return}

  function boost(p,y){

    else if(b.k===1){ctx.translate(0,-16+Math.sin(t*.1)*2);ctx.fillStyle='rgba(120,220,255,.25)';ctx.strokeStyle='#7fe3ff';ctx.lineWidth=2.5;ctx.beginPath();ctx.arc(0,0,12,0,6.283);ctx.fill();ctx.stroke();ctx.fillStyle='#7fe3ff';ctx.beginPath();ctx.moveTo(0,-6);ctx.lineTo(5,-3);ctx.lineTo(4,4);ctx.lineTo(0,7);ctx.lineTo(-4,4);ctx.lineTo(-5,-3);ctx.fill()}
    else{ctx.translate(0,-18+Math.sin(t*.1)*2);ctx.fillStyle='#9aa3b5';path(-7,-10,14,20,5);ctx.fill();ctx.fillStyle='#ff6b4a';ctx.fillRect(-7,2,14,4);ctx.fillStyle='#ffb02e';ctx.beginPath();ctx.moveTo(-4,10);ctx.lineTo(4,10);ctx.lineTo(0,16);ctx.fill()}
    ctx.restore();
  }
  function coin(c){const y=c.y-camY;if(c.got||y<-20||y>H+20)return;const w=Math.abs(Math.cos(t*.07+c.x))*7+1.5;ctx.fillStyle='#ffd34d';ctx.strokeStyle='#b8860b';ctx.lineWidth=2;ctx.beginPath();ctx.ellipse(c.x,y,w,8,0,0,6.283);ctx.fill();ctx.stroke()}

    const y=p.y-camY;if(y<-60||y>H+80)return;

    if(p.type===2){ctx.strokeStyle='rgba(60,30,10,.7)';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(24,0);ctx.lineTo(30,6);ctx.lineTo(26,10);ctx.lineTo(33,14);ctx.moveTo(48,0);ctx.lineTo(44,7);ctx.lineTo(50,14);ctx.stroke()}

  const FONT='ui-rounded,"Trebuchet MS",system-ui,sans-serif';
  // Скин «Вика»: тёмные волосы до плеч с чёлкой, светлая флисовая кофта на молнии,

  function vika(f,c,sy){
    const k=Math.max(-1,Math.min(1,(sy-1)/.14)),HAIR='#1a1413',SKIN='#f4cdb5',sw=Math.sin(t*.12)*.6;

    ctx.fillStyle='rgba(120,110,105,.25)';[[-9,-26],[-3,-20],[6,-28],[10,-18],[-11,-17],[1,-31]].forEach(([x,y])=>{ctx.fillRect(x,y,1.2,1.2)});
    ctx.fillStyle='#bdb3ac';path(-15,-16.5,30,3.5,2);ctx.fill();
    ctx.fillStyle=c;ctx.fillRect(-13,-15.2,26,1.4);
    // шея и воротник-стойка с молнией

    ctx.fillStyle='#efe9e4';path(-7.5,-36,15,5,2.5);ctx.fill();ctx.strokeStyle='#b9aea7';ctx.lineWidth=.8;ctx.stroke();
    ctx.strokeStyle='#8b2b2b';ctx.lineWidth=1.4;ctx.beginPath();ctx.moveTo(3,-35.5);ctx.lineTo(3,-24);ctx.stroke();
    ctx.fillStyle='#c0392b';ctx.fillRect(2,-24.5,2,3.4);
    // сумочка через плечо (спереди по ходу)
    ctx.strokeStyle='#15161a';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(-9,-34);ctx.lineTo(12,-21);ctx.stroke();
    ctx.fillStyle='#1b1c22';path(9,-24,13,9,3);ctx.fill();ctx.strokeStyle='#33343d';ctx.lineWidth=.9;ctx.beginPath();ctx.moveTo(9.5,-20.5);ctx.lineTo(21.5,-20.5);ctx.stroke();
    ctx.fillStyle='#d9b44a';ctx.beginPath();ctx.arc(15.5,-20.5,1,0,6.283);ctx.fill();
    // задняя рука на бедре
    ctx.lineCap='round';ctx.strokeStyle='#d2c9c3';ctx.lineWidth=6.5;ctx.beginPath();ctx.moveTo(-12,-30);ctx.quadraticCurveTo(-23,-24,-12,-17.5);ctx.stroke();
    ctx.fillStyle=SKIN;ctx.beginPath();ctx.arc(-11.5,-17,2.8,0,6.283);ctx.fill();
    // передняя рука: тянется вверх на прыжке, опускается при приземлении
    const ex=26,ey=-33-k*14;
    ctx.strokeStyle='#d6cdc7';ctx.lineWidth=6.5;ctx.beginPath();ctx.moveTo(12,-30);ctx.quadraticCurveTo(19,-34-k*7,ex,ey);ctx.stroke();
    ctx.strokeStyle=c;ctx.lineWidth=1.6;ctx.beginPath();ctx.moveTo(ex-3.2,ey+2);ctx.lineTo(ex-1,ey+3.2);ctx.stroke();
    ctx.fillStyle=SKIN;ctx.beginPath();ctx.arc(ex+1.5,ey-.8,3,0,6.283);ctx.fill();ctx.lineCap='butt';
    // голова
    ctx.fillStyle=SKIN;ctx.beginPath();ctx.ellipse(0,-44,13.2,12.6,0,0,6.283);ctx.fill();
    // глаза (светлые), взгляд по ходу
    [-2,7].forEach(ex=>{
      ctx.fillStyle='#fff';ctx.beginPath();ctx.ellipse(ex,-44,3.4,4.2,0,0,6.283);ctx.fill();
      ctx.fillStyle='#7fb0c4';ctx.beginPath();ctx.arc(ex+1,-43.5,2.5,0,6.283);ctx.fill();
      ctx.fillStyle='#1c2a33';ctx.beginPath();ctx.arc(ex+1.2,-43.5,1.2,0,6.283);ctx.fill();
      ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(ex+.4,-44.5,.7,0,6.283);ctx.fill();
      ctx.strokeStyle='#1a1413';ctx.lineWidth=1.3;ctx.beginPath();ctx.arc(ex,-44.2,3.5,Math.PI*1.05,Math.PI*1.95);ctx.stroke();
    });
    ctx.fillStyle='rgba(255,130,140,.28)';ctx.beginPath();ctx.ellipse(-4,-38.5,2.6,1.6,0,0,6.283);ctx.ellipse(10,-38.5,2.6,1.6,0,0,6.283);ctx.fill();
    ctx.strokeStyle='#d9a38a';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(4.2,-41);ctx.lineTo(5,-39.2);ctx.stroke();
    ctx.strokeStyle='#c95b64';ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(.8,-36.6);ctx.quadraticCurveTo(4,-34.3,7.5,-37);ctx.stroke();
    // волосы: макушка + чёлка с пробором
    ctx.fillStyle=HAIR;ctx.beginPath();ctx.moveTo(-14.2,-36);ctx.bezierCurveTo(-18,-66,18,-66,14.2,-36);
    ctx.lineTo(12,-42);ctx.quadraticCurveTo(8,-50,-1,-51);ctx.quadraticCurveTo(-8,-49,-11,-41);ctx.lineTo(-14.2,-36);ctx.closePath();ctx.fill();
    ctx.save();ctx.translate(sw,0);path(-17,-44,5.5,19,2.6);ctx.fill();path(11.5,-44,4.8,18,2.4);ctx.fill();ctx.restore();
    ctx.strokeStyle='rgba(255,255,255,.14)';ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(-8,-54);ctx.quadraticCurveTo(0,-57,7,-54);ctx.stroke();
    // брови
    ctx.strokeStyle='#2a1f1c';ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(-5,-49.2);ctx.quadraticCurveTo(-2,-51,.8,-49.6);ctx.moveTo(4.5,-49.6);ctx.quadraticCurveTo(7.5,-51,10,-49.6);ctx.stroke();
    ctx.restore();

  function alien(x,y,sx,sy,f,c,a,name,sk,b){
    sk|=0;const R=sk===1,N=sk===3;
    ctx.save();ctx.globalAlpha=a;ctx.translate(x,y);ctx.scale(sx,sy);
    if(b===1){const bx=-f*17,l=12+(Math.sin(t*1.9)+1)*7;ctx.fillStyle='#8a93a8';path(bx-6,-36,12,24,5);ctx.fill();ctx.fillStyle='#ff6b4a';ctx.fillRect(bx-6,-20,12,4);
      ctx.fillStyle='#ff9a2e';ctx.beginPath();ctx.moveTo(bx-5,-12);ctx.lineTo(bx+5,-12);ctx.lineTo(bx,-12+l);ctx.fill();ctx.fillStyle='#ffe27a';ctx.beginPath();ctx.moveTo(bx-2.5,-12);ctx.lineTo(bx+2.5,-12);ctx.lineTo(bx,-12+l*.55);ctx.fill()}
    if(sk===4){vika(f,c,sy)}else{
    ctx.fillStyle=R?'#7d889f':N?'#14143a':'#ff9f43';path(-14,-6,11,6,3);ctx.fill();path(3,-6,11,6,3);ctx.fill();
    ctx.fillStyle=R?'#5b6786':N?'#12123a':'#eef2ff';path(-15,-30,30,26,10);ctx.fill();
    ctx.fillStyle=c;ctx.fillRect(-15,-19,30,4);
    if(N){ctx.save();ctx.shadowColor=c;ctx.shadowBlur=10;ctx.strokeStyle=c;ctx.lineWidth=1.5;path(-15,-30,30,26,10);ctx.stroke();ctx.restore()}
    if(sk!==2){ctx.strokeStyle=R?'#9aa3b5':c;ctx.lineWidth=2.5;ctx.beginPath();ctx.moveTo(0,-54);if(R)ctx.lineTo(f*3,-64);else ctx.quadraticCurveTo(-3,-62,f*5,-66);ctx.stroke();
      ctx.fillStyle=R?'#ff3355':'#ff6b81';ctx.beginPath();ctx.arc(f*(R?3:5),R?-65:-67,3.8,0,6.283);ctx.fill()}
    ctx.fillStyle=R?'#aab4c8':N?'#0c0c28':c;ctx.beginPath();ctx.ellipse(0,-41,16,14,0,0,6.283);ctx.fill();
    if(N){ctx.save();ctx.shadowColor=c;ctx.shadowBlur=10;ctx.strokeStyle=c;ctx.lineWidth=1.5;ctx.stroke();ctx.restore()}
    if(R){ctx.fillStyle='#14182a';path(-12,-48,24,10,4);ctx.fill();ctx.fillStyle='#ff3355';ctx.fillRect(-9+f*2,-44,18,3)}
    else{
      ctx.fillStyle='#fff';ctx.beginPath();ctx.ellipse(-6,-42,4.6,5.6,0,0,6.283);ctx.ellipse(6,-42,4.6,5.6,0,0,6.283);ctx.fill();
      ctx.fillStyle='#14213d';ctx.beginPath();ctx.arc(-6+f*1.6,-41,2.3,0,6.283);ctx.arc(6+f*1.6,-41,2.3,0,6.283);ctx.fill();
      ctx.strokeStyle=N?c:'#14513a';ctx.lineWidth=1.6;ctx.beginPath();ctx.arc(0,-36,3.5,.2,2.9);ctx.stroke();
      ctx.fillStyle='rgba(160,220,255,.2)';ctx.strokeStyle='rgba(225,247,255,.85)';ctx.lineWidth=2;ctx.beginPath();ctx.arc(0,-41,20,0,6.283);ctx.fill();ctx.stroke();
    }
    if(sk===2){ctx.fillStyle='#ffd34d';ctx.strokeStyle='#b8860b';ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(-11,-57);ctx.lineTo(-11,-68);ctx.lineTo(-5,-62);ctx.lineTo(0,-71);ctx.lineTo(5,-62);ctx.lineTo(11,-68);ctx.lineTo(11,-57);ctx.closePath();ctx.fill();ctx.stroke();ctx.fillStyle='#ff4d6d';ctx.beginPath();ctx.arc(0,-62,2,0,6.283);ctx.fill()}
    }
    if(b===2){ctx.fillStyle='rgba(120,220,255,.16)';ctx.strokeStyle='rgba(140,230,255,.9)';ctx.lineWidth=2.5;ctx.beginPath();ctx.arc(0,-33,38+Math.sin(t*.2)*1.5,0,6.283);ctx.fill();ctx.stroke()}

      ctx.lineWidth=3;ctx.strokeStyle='rgba(8,10,30,.8)';ctx.strokeText(name,x,y-80);ctx.fillStyle=c;ctx.fillText(name,x,y-80);ctx.restore()}
  }
  function draw(){
    bg();for(const p of plats)plat(p);for(const c of coins)coin(c);
for(const p of players){
      if(!p||p.i===me||p.dead)continue;const sy=p.y-camY;
      if(sy>-90&&sy<H+90)alien(p.x,sy+P.h/2,1,1,1,COLORS[p.i],.45,p.n,p.k,p.b);
    }
    if(!dead&&players[me]){
      const s=Math.max(0,Math.min(1,-P.vy/13)),sy=1+.14*s-.3*squash-(P.vy>0?.03:0),sx=1-.08*s+.22*squash;
      alien(P.x,P.y+P.h/2-camY,sx,sy,P.face,COLORS[me],1,isSolo?'':nick,save.eq.skin,P.jet>0?1:P.shield?2:0);
    }
    const L=leader(),total=list().length,alive=list().filter(p=>!p.dead).length,bl=L?L.score-score:0;
    ctx.shadowColor='rgba(0,0,0,.5)';ctx.shadowBlur=6;ctx.textAlign='left';
    ctx.fillStyle='#fff';ctx.font='800 28px '+FONT;ctx.fillText(score,16,38);
    ctx.font='600 13px '+FONT;ctx.fillStyle='rgba(255,255,255,.75)';ctx.fillText('Рекорд '+Math.max(best,score),16,56);
    ctx.fillStyle='#ffd34d';ctx.beginPath();ctx.arc(22,71,6.5,0,6.283);ctx.fill();ctx.fillStyle='#fff';ctx.fillText(save.coins,34,76);
    if(total>1){ctx.fillStyle='rgba(255,255,255,.75)';ctx.fillText('Живы: '+alive+'/'+total,16,94)}
    if(!dead&&L&&bl>MAX_SCORE_DIFF*.5){ctx.fillStyle='#ff8a8a';ctx.fillText('Отставание '+bl+' / '+MAX_SCORE_DIFF,16,112)}
    ctx.shadowBlur=0;
    if(!dead&&L&&L.score>score&&L.y-camY<-20){
      const txt=L.n+'  +'+bl;ctx.font='700 12px '+FONT;
      const w=ctx.measureText(txt).width+18,x=Math.max(w/2+6,Math.min(W-w/2-6,L.x));
      ctx.fillStyle=COLORS[L.i];ctx.beginPath();ctx.moveTo(x,118);ctx.lineTo(x-7,128);ctx.lineTo(x+7,128);ctx.fill();
      path(x-w/2,128,w,22,11);ctx.fill();ctx.fillStyle='#10142b';ctx.textAlign='center';ctx.fillText(txt,x,143);
    }
    if(dead&&started){
      ctx.textAlign='center';ctx.shadowColor='rgba(0,0,0,.6)';ctx.shadowBlur=8;ctx.fillStyle='#fff';ctx.font='800 22px '+FONT;ctx.fillText('Вы выбыли',W/2,140);
      ctx.font='600 14px '+FONT;ctx.fillText(deathMsg,W/2,164);if(L)ctx.fillText('Наблюдаем за '+L.n,W/2,186);ctx.shadowBlur=0;
    }
    ctx.textAlign='left';
  }
  let last=0;
  function loop(ts){
    const dt=Math.min((ts-last)/16.667||1,2.5);last=ts;t+=dt;
    if(started)update(dt);
    draw();requestAnimationFrame(loop);
  }
  scr('menu');requestAnimationFrame(loop);
})();
